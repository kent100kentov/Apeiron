<script>(function(root){
'use strict';
const VERSION=1, NAMES=['quay','mira','tower','willow'];

const clone=x=>JSON.parse(JSON.stringify(x));
function die(s){for(;;){let x=s.rng|0;x^=x<<13;x^=x>>>17;x^=x<<5;s.rng=x>>>0;if(s.rng<4294967292)return 1+(s.rng%6);}}

function neighbors(s){if(s.location==='bank')return s.bridge?['willow']:[];const i=s.order.indexOf(s.location);return [s.order[(i+3)%4],s.order[(i+1)%4]];}
function beam(p,phase){const x=p%4,y=Math.floor(p/4);return phase%2===0?y===1:x===1;}
function pocketMoves(s){const p=s.pocket;if(!p)return[];const x=p.pos%4,y=Math.floor(p.pos/4);return [[x-1,y],[x+1,y],[x,y-1],[x,y+1]].filter(q=>q[0]>=0&&q[0]<4&&q[1]>=0&&q[1]<4).map(q=>q[1]*4+q[0]).filter(n=>n!==5&&n!==10&&n!==4&&!beam(n,p.phase));}
function action(id,extra){return Object.assign({id:id},extra||{});}
function legal(s){
 if(s.ending)return[];
 if(s.pocket){const a=pocketMoves(s).map(n=>action('step',{to:n}));a.push(action('wait'));
  if(s.pocket.pos===3&&!s.lens&&!s.aligned){a.push(action('takeLens'));if(s.beacon)a.push(action('align'));}
  if(s.pocket.pos===12)a.push(action('leavePocket'));

 let a=neighbors(s).map(to=>action('move',{to:to}));
 if(s.location==='quay'){if(s.medicine&&!s.wet&&!s.delivered)a.push(action('deliver'));if(s.delivered&&boatHere(s))a.push(action('sail'));a.push(action('talkBoat'));}
 if(s.location==='mira'){if(s.oil&&!s.wood)a.push(action('tradeOil'));if(!s.tool&&s.rope)a.push(action('borrowTool'));if(s.medicine&&s.wet)a.push(action('dry'));a.push(action('talkMira'));}
 if(s.location==='tower'){if(!s.beacon&&s.oil)a.push(action('light'));if(s.beacon&&s.folds<3)a.push(action('fold'));a.push(action('lookTower'));}
 if(s.location==='willow'){
  if(!s.medicine&&!s.delivered){if(s.rope)a.push(action('rescue'));a.push(action('risk'));}
  if(s.wood&&!s.bridge)a.push(action('repair'));
  if(s.tool&&!s.bridge)a.push(action('toolBridge'));
  if(s.lens&&!s.bridge)a.push(action('lensBridge'));
  if(s.bridge)a.push(action('cross'));
  if(s.beacon||s.rope||s.pocketSeen)a.push(action('descend'));
  a.push(action('lookWillow'));
 }
 return a;
}
function equals(a,b){return a.id===b.id&&a.to===b.to;}
function apply(state,cmd){
 if(!cmd||!legal(state).some(a=>equals(a,cmd)))throw Error('Illegal action');
 const s=clone(state);s.lastDice=[];let tick=true,key=cmd.id;
 switch(cmd.id){
 case'move':s.location=cmd.to;key='move';break;
 case'talkBoat':case'talkMira':case'lookTower':case'lookWillow':tick=false;s.seen[cmd.id]=true;break;
 case'tradeOil':s.oil--;s.wood++;break;
 case'borrowTool':s.rope--;s.tool=true;break;
 case'dry':s.wet=false;break;
 case'light':s.oil--;s.beacon=true;break;
 case'fold':{const r=s.order.slice(1);r.unshift(r.pop());s.order=[s.order[0]].concat(r);s.folds++;break;}
 case'rescue':s.rope--;s.medicine=true;break;
 case'risk':s.lastDice=[die(s),die(s)];s.medicine=true;s.wet=s.lastDice[0]+s.lastDice[1]<7;key=s.wet?'riskWet':'riskDry';break;
 case'deliver':s.delivered=true;s.medicine=false;break;
 case'repair':s.wood--;s.bridge=true;s.bridgeKind='wood';break;
 case'toolBridge':s.tool=false;s.bridge=true;s.bridgeKind='detour';break;
 case'lensBridge':s.lens=false;s.bridge=true;s.bridgeKind='shadow';break;
 case'descend':if(!s.pocketSeen&&!s.beacon)s.rope--;s.pocketSeen=true;s.pocket={pos:12,phase:0,moves:0};break;
 case'step':s.pocket.pos=cmd.to;s.pocket.phase++;s.pocket.moves++;tick=false;break;
 case'wait':s.pocket.phase++;s.pocket.moves++;tick=false;break;
 case'takeLens':s.lens=true;s.pocketDark=true;s.pocket.phase++;s.pocket.moves++;tick=false;break;
 case'align':s.aligned=true;s.bridge=true;s.bridgeKind='roots';s.pocket.phase++;s.pocket.moves++;tick=false;break;
 case'leavePocket':s.pocket=null;break;
 case'sail':s.location='bank';s.ending='boat';break;
 case'cross':s.location='bank';s.ending=s.bridgeKind;break;
 }
 if(tick)s.turn++;

 if(s.log.length>60)s.log=s.log.slice(-60);

}

})(typeof window==='undefined'?globalThis:window);

var TEXT={
uk:{chapter:'Розділ I · ігрова демоверсія',title:'Останній ліхтар',intro:'На іншому березі на тебе чекає лист. Його написано твоєю рукою — але ти ще не знаєш жодного з цих слів.',objective:'Перейди ріку. <b>Виріши, що залишиш після себе.</b>',quay:'Причал',mira:'Майстерня Міри',tower:'Мовчазний маяк',willow:'Стара верба',bank:'Інший берег',oil:'Масло',rope:'Мотузка',wood:'Дошки',tool:'Інструмент',medicine:'Пакунок',wet:'Намоклий пакунок',lens:'Лінза',turn:'Хід',boat:'До відплиття',left:'ходів',gone:'Човен вже відпливла',saved:'Збережено на цьому пристрої',saveFail:'Safari не дозволив зберегти. Не закривайте вкладку до завершення.',version:'Apeiron · 0.1.0 · самостійна демоверсія',reset:'Спочатку',resetTitle:'Почати іншу історію?',resetText:'Поточне проходження буде замінено. Можна залишитися й завершити справи.',yes:'Почати заново',no:'Залишитися',journal:'Те, що вже сталося',hint:'Порада мандрівникові',mapHint:'Світлі підписи — доступні переходи',toActions:'До дій та розмови',backMap:'Назад до карти',pocketTitle:'Сад під водою',pocketIntro:'Верба розгорнулась у цілий світ. Кам’яний сторож повертає промінь після кожного кроку. Пройди до лінзи вгорі праворуч і повернися до входу.',pocketLegend:'Світлі клітини — крок. Мідні смуги — промінь зараз. Після кроку його напрям зміниться.',pocketNear:'Ти біля входу. Вихід поверне тебе до тієї самої верби.',pocketLens:'Перед тобою лінза. Можна забрати світло із собою. Або, якщо маяк зовні горить, повернути його в коріння.',pocketWalk:'Сторож слухає кроки. Подивись, які клітини стануть вільними після його повороту.',guidePocket:'Промінь змінює ряд на стовпець. «Зачекати» повертає його без переміщення. Каміння обійти не можна. Помилки не вбивають героя; небезпечні кроки не пропонуються.',oneTurn:'1 хід світу',noTurn:'Світ зовні чекає',free:'Розмова · час не минає',endingTitle:'Лист був справжнім',endingHook:'«Якщо ти читаєш це, не довіряй першій знайомій двері. Я вже відчинив її за тебе». У складці листа — маленьке зображення цього самого острова.',endingDemo:'Перший розділ завершено. Це коротка демоверсія: наступні світи ще попереду.',again:'Інший вибір — інша історія',endBoat:'Перевізник ховає сухий пакунок під плащ. «Тепер встигну до доньки». На острові залишився закритий шлях, але твоя допомога вже їде далі.',endWood:'Міра бачить із берега новий міст. Завтра ним пройде не лише герой. Масла для старого маяка більше немає — на цю ніч він лишився темним.',endDetour:'Інструмент залишився в підпорах. Ти відкрив шлях уздовж коріння, а Міра отримала твою мотузку. Декому вистачає маленької допомоги, щоб теж рушити далі.',endRoots:'Маяк і лінза відповіли одне одному. Коріння піднялося над водою. Сад зберіг своє світло, а на острові з’явився шлях, якого раніше не було.',endShadow:'Лінза відчинила тіньовий міст. Ти перейшов, але сад усередині верби потемнів. Тепер ти знаєш, звідки взявся цей шлях — і яку ціну він має.',speakerBoat:'Остап, перевізник',roleBoat:'Хоче відвезти ліки доньці',speakerMira:'Міра, майстриня',roleMira:'Ремонтує шляхи й тримає слово',speakerTower:'Мовчазний маяк',roleTower:'Світло зв’язує далекі місця',speakerWillow:'Верба біля води',roleWillow:'Зовні дерево. Усередині — інший світ.',speakerPocket:'Кам’яний сторож',rolePocket:'Береже світло саду',speakerEnd:'Твій власний почерк',roleEnd:'Історія пам’ятає зроблений вибір',startQuay:'«Я вийду, коли вода торкнеться останньої сходинки. Пакунок для доньки змило до верби. <b>Принесеш його сухим — візьму з собою.</b> Не встигнеш — шукай інший шлях».',startMira:'«За краплю масла дам дошки для містка. А за мотузку — інструмент для обходу. <b>Забирати все не обов’язково.</b> Подумай, що ще можеш зробити цими речами».',startTower:'Погаслий ліхтар повернуто до верби. На камені напис: «Одне світло — два береги». Знизу долинає плескіт. <b>Останню порцію масла можна витратити тут.</b>',startWillow:'У корінні застряг пакунок. Його можна дістати мотузкою або ризикнути й стрибнути до води. Далі — зламаний місток. На стовбурі є щілина, схожа на двері.',boatAfter:'«Пакунок у безпеці. Якщо готовий — сідай. Решту справ вирішувати тобі».',boatGone:'На причалі порожньо. Човен відпливла. Та ріка не стала стіною: Міра знає про місток, а верба приховує інший шлях.',litTower:'Промінь торкнувся води. Верба відповіла зеленим світлом. Остап бачить вогонь і може чекати довше. На кільці маяка є три положення: поворот змінює сусідство місць, не їхню пам’ять.',willowEmpty:'Пакунка в корінні вже немає. Залишилися зламаний місток і двері у вербі. Те, що ти зробиш тут, визначить шлях через ріку.',bridgeWillow:'Над водою є прохід. Він залишиться тут після твого відходу. Можна рушати до листа — або ще подбати про людей на острові.',guideQuay:'Човен відпливає після 8 ходів, із запаленим маяком — після 12. Розмови й час поза грою нічого не витрачають. Якщо не встигнеш, залишаться інші шляхи.',guideMira:'Масло можна обміняти на дошки або спалити в маяку. Мотузка допомагає врятувати сухий пакунок чи взяти інструмент. Речі витрачаються один раз.',guideTower:'Запалений маяк дає більше часу перевізнику та дозволяє налаштувати лінзу всередині верби. Поворот змінює, які місця поруч; речі й люди залишаються у своїх місцях.',guideWillow:'Без мотузки сухий пакунок вийде дістати на суму 7+ двох кубиків: 21 із 36 комбінацій. Намоклий пакунок можна висушити у Міри. Перейти ріку можна й без човна.',dice:'Випало',route:'Перехід',moveDetail:'До сусіднього місця',actions:{talkBoat:['Розпитати Остапа','Дізнатися про човен та пакунок'],talkMira:['Розпитати Міру','Чим вона може допомогти'],lookTower:['Роздивитися напис','Світло та дивне кільце'],lookWillow:['Оглянути коріння','Пакунок, місток і щілина'],tradeOil:['Віддати масло за дошки','Масло −1 · дошки +1'],borrowTool:['Залишити мотузку за інструмент','Мотузка −1 · інструмент +1'],dry:['Висушити пакунок біля печі','Пакунок знову буде придатним'],light:['Запалити маяк','Масло −1 · човен чекатиме до ходу 12'],fold:['Повернути кільце світу','Три місця поміняють положення. Усе всередині збережеться'],rescue:['Дістати пакунок мотузкою','Мотузка −1 · гарантовано сухий пакунок'],risk:['Стрибнути до пакунка','2 кубики · 7+ сухо, інакше знадобиться Міра'],deliver:['Передати сухий пакунок Остапу','Ліки залишаться у перевізника'],sail:['Сісти в човен','Перетнути ріку й отримати лист'],repair:['Скласти місток із дощок','Дошки −1 · відкриється постійний шлях'],toolBridge:['Закріпити обхід інструментом','Інструмент залишиться в опорах'],lensBridge:['Відчинити міст лінзою','Лінза стане мостом. Сад залишиться темним'],cross:['Перейти на інший берег','Побачити наслідки й прочитати лист'],descend:['Увійти всередину верби','Окремий світ · мотузка потрібна лише для першого входу без маяка'],wait:['Зачекати повороту променя','Промінь змінить напрям. Ти лишишся на місці'],takeLens:['Забрати лінзу','Отримаєш спосіб створити міст. Світло піде із саду'],align:['Повернути світло в коріння','Зовнішній маяк допомагає · виросте міст, сад збереже світло'],leavePocket:['Повернутися до верби','Результат залишиться і в саду, і на острові']},events:{arrival:'Ти прийшов до ріки з маслом і мотузкою. На іншому березі чекає дивний лист.',tradeOil:'Міра взяла масло й віддала дошки. Старому маяку доведеться обійтися без цієї порції.',borrowTool:'Міра отримала мотузку й позичила інструмент. Тепер можна закріпити обхід.',dry:'Пакунок висох біля печі. Ліки можна віддати Остапу.',light:'Маяк засвітився. Остап чекатиме довше; у вербі відкрився світлий вхід.',fold:'Поверхня змінила сусідство. Кожне місце зберегло свої речі та минуле.',rescue:'Мотузка залишилася в корінні. Пакунок сухий.',riskDry:'Стрибок вдався. Пакунок залишився сухим, мотузка збережена.',riskWet:'Пакунок намок. Міра може його висушити; інші шляхи теж залишилися.',deliver:'Остап отримав ліки. Допомога вже має значення, навіть якщо ти обереш іншу дорогу.',repair:'Дошки стали містком. Цим шляхом зможуть ходити й інші.',toolBridge:'Інструмент залишився в опорах. З’явився обхід над водою.',lensBridge:'Лінза стала тіньовим мостом. Її більше немає в інвентарі.',descend:'Усередині верби розгорнувся сад під водою.',takeLens:'Ти взяв лінзу. Сад потемнів, але в тебе з’явився новий спосіб перейти ріку.',align:'Світло маяка й саду з’єдналися. Коріння виросло у міст зовні.',leavePocket:'Ти повернувся до тієї самої верби. Зміни всередині збережені.',boatLeaves:'Човен відпливла. На острові лишилися інші шляхи.',sail:'Ти переплив ріку з Остапом.',cross:'Ти перейшов ріку створеним шляхом.',move:'Ти змінив місце.',talkBoat:'Остап розповів про свій шлях.',talkMira:'Міра пояснила, які речі їй потрібні.',lookTower:'Напис пов’язує світло маяка з вербою.',lookWillow:'Ти помітив щілину, пакунок і сліди старого мосту.'}},
en:{chapter:'Chapter I · playable demo',title:'The last lantern',intro:'A letter is waiting across the river. The handwriting is yours — but you have never written these words.',objective:'Cross the river. <b>Decide what you leave behind.</b>',quay:'The landing',mira:'Mira’s workshop',tower:'Silent lighthouse',willow:'Old willow',bank:'The far bank',oil:'Oil',rope:'Rope',wood:'Planks',tool:'Tool',medicine:'Parcel',wet:'Wet parcel',lens:'Lens',turn:'Turn',boat:'Boat leaves in',left:'turns',gone:'The boat has left',saved:'Saved on this device',saveFail:'Safari could not save. Keep this tab open until you finish.',version:'Apeiron · 0.1.0 · standalone demo',reset:'Restart',resetTitle:'Begin another story?',resetText:'This playthrough will be replaced. You can stay and finish your business.',yes:'Start again',no:'Stay here',journal:'What has happened',hint:'A traveller’s advice',mapHint:'Bright labels mark available paths',toActions:'Go to actions and dialogue',backMap:'Back to the map',pocketTitle:'The underwater garden',pocketIntro:'The willow has unfolded into a whole world. The stone keeper turns its beam after each step. Reach the lens at the top right, then return to the entrance.',pocketLegend:'Pale cells: a step. Copper stripes: the beam now. Its direction changes after a step.',pocketNear:'You are at the entrance. Leaving returns you to the same willow.',pocketLens:'The lens is within reach. Take its light with you — or, if the lighthouse outside is lit, turn it into the roots.',pocketWalk:'The keeper listens to footsteps. Notice which cells will be free after the beam turns.',guidePocket:'The beam alternates between a row and a column. Waiting turns it without moving you. Rocks block movement. Dangerous steps are not offered; mistakes do not kill you.',oneTurn:'1 world turn',noTurn:'The world outside waits',free:'Conversation · no time passes',endingTitle:'The letter was real',endingHook:'“If you are reading this, do not trust the first familiar door. I have already opened it for you.” Folded inside is a tiny drawing of this very island.',endingDemo:'The first chapter is complete. This is a short demo; the next worlds are still ahead.',again:'Another choice, another story',endBoat:'Ostap hides the dry parcel beneath his coat. “Now I can reach my daughter.” The island’s crossing remains closed, but your help is already travelling onward.',endWood:'Mira can see the new footbridge from shore. Tomorrow, others will use it too. The old lighthouse has no oil left; tonight, it stays dark.',endDetour:'The tool remains in the supports. You opened a path along the roots, and Mira has your rope. A little help lets other people move forward too.',endRoots:'The lighthouse and lens answered each other. Roots rose over the river. The garden kept its light, and the island gained a path that did not exist before.',endShadow:'The lens opened a shadow bridge. You crossed, but the world inside the willow grew dark. You know where this path came from — and what it cost.',speakerBoat:'Ostap, the ferryman',roleBoat:'Wants to bring medicine to his daughter',speakerMira:'Mira, the carpenter',roleMira:'Repairs paths and keeps her word',speakerTower:'The silent lighthouse',roleTower:'Light connects distant places',speakerWillow:'The willow by the river',roleWillow:'A tree outside. Another world within.',speakerPocket:'The stone keeper',rolePocket:'Guards the garden’s light',speakerEnd:'Your own handwriting',roleEnd:'The story remembers your choices',startQuay:'“I leave when the water reaches the last step. My daughter’s parcel washed down to the willow. <b>Bring it back dry and I will take you across.</b> Miss the boat and you will need another path.”',startMira:'“A little oil buys planks for the bridge. Leave a rope and I will lend you a tool. <b>You do not have to take everything.</b> Think what else those things might do.”',startTower:'The dead lantern points toward the willow. A carving reads: “One light, two shores.” Water laps below. <b>Your last measure of oil could be used here.</b>',startWillow:'A parcel is caught among the roots. Reach it with a rope, or risk a jump toward the water. Beyond it is a broken footbridge. A crack in the trunk resembles a door.',boatAfter:'“The parcel is safe. Get in when you are ready. The rest of your business is yours to choose.”',boatGone:'The landing is empty. The boat has left. But the river is not a wall: Mira knows about the bridge, and the willow hides another path.',litTower:'Light touched the river. The willow answered in green. Ostap can see the beacon and wait longer. The lighthouse ring has three positions: turning it changes neighbours, never memories.',willowEmpty:'The parcel is no longer among the roots. The broken bridge and the willow door remain. What you do here will shape a path across the river.',bridgeWillow:'A path now crosses the water. It will remain after you leave. Follow your letter, or take a little more time for the people here.',guideQuay:'The boat leaves after 8 turns, or 12 with a lit lighthouse. Conversations and time away from the game cost nothing. If you miss it, other paths remain.',guideMira:'Oil can become planks or lighthouse light. Rope can keep the parcel dry or buy a tool. Items are spent only once.',guideTower:'A lit beacon gives Ostap more time and lets you align the lens inside the willow. Turning the ring changes neighbouring places; their people and contents stay with them.',guideWillow:'Without rope, a dry parcel needs 7+ on two dice: 21 of 36 combinations. Mira can dry a wet parcel. You can cross without the boat too.',dice:'Rolled',route:'Travel',moveDetail:'To a neighbouring place',actions:{talkBoat:['Ask Ostap','Learn about the boat and parcel'],talkMira:['Ask Mira','Find out how she can help'],lookTower:['Read the carving','The light and the strange ring'],lookWillow:['Look among the roots','A parcel, bridge and crack'],tradeOil:['Trade oil for planks','Oil −1 · planks +1'],borrowTool:['Leave rope for a tool','Rope −1 · tool +1'],dry:['Dry the parcel by the stove','The medicine will be usable again'],light:['Light the lighthouse','Oil −1 · the boat waits until turn 12'],fold:['Turn the world ring','Three places change position. Their contents remain'],rescue:['Reach the parcel with rope','Rope −1 · guaranteed dry parcel'],risk:['Jump for the parcel','2 dice · 7+ dry, otherwise Mira can help'],deliver:['Give Ostap the dry parcel','The ferryman keeps the medicine'],sail:['Board the boat','Cross the river and receive your letter'],repair:['Build a footbridge','Planks −1 · a lasting route opens'],toolBridge:['Secure the detour with the tool','The tool stays in the supports'],lensBridge:['Open a bridge with the lens','The lens becomes a bridge; the garden stays dark'],cross:['Cross to the far bank','See the consequences and read your letter'],descend:['Enter the willow','Another world · first unlit entrance needs rope'],wait:['Wait for the beam to turn','The beam turns; you stay where you are'],takeLens:['Take the lens','Gain a way to cross; the light leaves the garden'],align:['Turn the light into the roots','The outer beacon helps; roots form a bridge and the garden keeps its light'],leavePocket:['Return to the willow','The result stays in the garden and on the island']},events:{arrival:'You reached the river with oil and rope. A strange letter waits across the water.',tradeOil:'Mira took oil and gave you planks. That oil can no longer light the lighthouse.',borrowTool:'Mira kept the rope and lent a tool. You can now secure the detour.',dry:'The parcel dried by the stove. The medicine can be given to Ostap.',light:'The beacon is lit. Ostap can wait longer; a bright entrance opened in the willow.',fold:'The surface changed its neighbours. Every place kept its contents and past.',rescue:'The rope stayed among the roots. The parcel is dry.',riskDry:'The jump worked. The parcel stayed dry, and you kept the rope.',riskWet:'The parcel got wet. Mira can dry it; other paths remain too.',deliver:'Ostap has the medicine. Your help matters even if you choose another path.',repair:'Planks became a bridge. Other people can use it too.',toolBridge:'The tool stayed in the supports. A detour opened above the water.',lensBridge:'The lens became a shadow bridge. It is no longer in your inventory.',descend:'An underwater garden unfolded inside the willow.',takeLens:'You took the lens. The garden grew dark, but you gained another way across.',align:'Beacon and garden light connected. Roots grew into a bridge outside.',leavePocket:'You returned to the same willow. Changes inside are remembered.',boatLeaves:'The boat has left. Other paths remain on the island.',sail:'You crossed the river with Ostap.',cross:'You crossed by the path you created.',move:'You moved to another place.',talkBoat:'Ostap explained his journey.',talkMira:'Mira explained which supplies she needs.',lookTower:'The carving connects the beacon to the willow.',lookWillow:'You noticed a crack, a parcel and an old bridge.'}}
};

function map(){var box=el('map');box.innerHTML=landscape();var lines='<svg class="routes" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">';for(var i=0;i<4;i++){var a=spots[i],b=spots[(i+1)%4];lines+='<path d="M'+a[0]+' '+a[1]+' L'+b[0]+' '+b[1]+'" stroke="#e0c799" stroke-width=".35" stroke-dasharray="1 1" opacity=".35" fill="none"/>';}lines+='</svg>';box.insertAdjacentHTML('beforeend',lines);s.order.forEach(function(id,i){var b=document.createElement('button');b.className='mapnode'+(id===s.location?' current':'')+(E.neighbors(s).indexOf(id)>=0?' reachable':'');b.style.left=spots[i][0]+'%';b.style.top=spots[i][1]+'%';b.innerHTML=building(id)+'<span>'+T(id)+'</span>';b.setAttribute('aria-label',T('route')+': '+T(id));b.disabled=!E.legal(s).some(function(a){return a.id==='move'&&a.to===id;});b.onclick=function(){act({id:'move',to:id});};box.appendChild(b);});var bank=document.createElement('div');bank.className='mapnode'+(s.location==='bank'?' current':'');bank.style.left='85%';bank.style.top='47%';bank.innerHTML=building('bank')+'<span>'+T('bank')+'</span>';box.appendChild(bank);if(E.boatHere(s)&&!s.ending)box.insertAdjacentHTML('beforeend','<svg class="boat" viewBox="0 0 150 90" aria-hidden="true"><path d="M10 55q60 8 127-6l-25 28-72 4z" fill="#866b4e"/><path d="M20 57l102-8" stroke="#c4ab7a" stroke-width="3"/><path d="M72 52V5l44 43z" fill="#c5c0a1"/><path d="M70 6v54" stroke="#604e43" stroke-width="3"/><path d="M30 86q58-12 103-3" stroke="#8ab3ad" fill="none"/></svg>');box.insertAdjacentHTML('beforeend','<div class="stage-note">'+T('mapHint')+'</div>');}
function grid(){var g=el('pocketGrid');g.innerHTML='';var possible=E.pocketMoves(s);for(var i=0;i<16;i++){(function(n){var b=document.createElement('button');var blocked=[4,5,10].indexOf(n)>=0,beam=E.beam(n,s.pocket.phase);b.className='tile'+(blocked?' block':beam?' beam':'')+(possible.indexOf(n)>=0?' safe':'')+(n===s.pocket.pos?' you':'');b.disabled=possible.indexOf(n)<0;b.setAttribute('aria-label',(n%4+1)+','+(Math.floor(n/4)+1)+(beam?(LANG==='uk'?' · промінь':' · beam'):''));b.onclick=function(){act({id:'step',to:n});};var pic='';if(blocked)pic='<svg viewBox="0 0 60 60"><path d="M5 44l15-29 23 4 13 29-30 9z" fill="#52625b"/><path d="M20 15l6 42 17-38" fill="#718379"/></svg>';else if(n===3)pic=icon('lens');else if(n===12)pic='<svg viewBox="0 0 60 60"><path d="M12 55V22Q30-6 48 22v33" fill="#385d55" stroke="#9bb9a0"/><path d="M23 55V24q8-12 15 0v31" fill="#0c242e"/></svg>';if(n===s.pocket.pos)pic='<svg viewBox="0 0 60 60"><path d="M15 53l5-27q10-18 20 0l6 27z" fill="#d4b27a"/><circle cx="30" cy="18" r="9" fill="#e4c99a"/><path d="M25 26l-5 27h24l-8-27" fill="#34515b"/><path d="M46 25v30" stroke="#e9cb95" stroke-width="3"/></svg>';b.innerHTML=pic+'<span class="n">'+String.fromCharCode(65+n%4)+(4-Math.floor(n/4))+'</span>';g.appendChild(b);})(i);}}
function actionText(a){if(a.id==='move')return [T(a.to),T('moveDetail')];return TEXT[LANG].actions[a.id]||[a.id,''];}
function cost(a){if(['talkBoat','talkMira','lookTower','lookWillow'].indexOf(a.id)>=0)return T('free');return s.pocket&&a.id!=='leavePocket'?T('noTurn'):T('oneTurn');}
function dice(n){var dots={1:[[12,12]],2:[[6,6],[18,18]],3:[[6,6],[12,12],[18,18]],4:[[6,6],[18,6],[6,18],[18,18]],5:[[6,6],[18,6],[12,12],[6,18],[18,18]],6:[[6,5],[18,5],[6,12],[18,12],[6,19],[18,19]]};return '<span class="die"><svg viewBox="0 0 24 24" fill="currentColor">'+dots[n].map(function(p){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2"/>';}).join('')+'</svg></span>';}
function textScene(){if(s.ending)return ['End',T('endingTitle'),T('endingHook')];if(s.pocket)return ['Pocket',T('pocketTitle'),T(s.pocket.pos===3?'pocketLens':s.pocket.pos===12?'pocketNear':'pocketWalk')];if(s.location==='quay')return ['Boat',T('speakerBoat'),T(!E.boatHere(s)?'boatGone':s.delivered?'boatAfter':'startQuay')];if(s.location==='mira')return ['Mira',T('speakerMira'),T('startMira')];if(s.location==='tower')return ['Tower',T('speakerTower'),T(s.beacon?'litTower':'startTower')];return ['Willow',T('speakerWillow'),T(s.bridge?'bridgeWillow':s.medicine||s.delivered?'willowEmpty':'startWillow')];}
function render(){document.documentElement.lang=LANG;el('map').setAttribute('aria-label',LANG==='uk'?'Карта острова':'Island map');el('inventory').setAttribute('aria-label',LANG==='uk'?'При собі':'Inventory');el('dice').setAttribute('aria-label',LANG==='uk'?'Кубики':'Dice');document.querySelector('nav').setAttribute('aria-label',LANG==='uk'?'Налаштування':'Settings');el('lang').textContent=LANG==='uk'?'EN':'UA';el('reset').textContent=T('reset');el('chapter').textContent=T('chapter');el('title').textContent=T('title');el('intro').textContent=T('intro');el('objective').innerHTML=T('objective');el('toActions').textContent=T('toActions');el('saveText').textContent=saveOK?T('saved'):T('saveFail');el('version').textContent=T('version');el('hintLabel').textContent=T('hint');el('journalLabel').textContent=T('journal');map();var inv=[];['oil','rope','wood'].forEach(function(k){if(s[k])inv.push('<span class="badge">'+icon(k)+T(k)+' ×'+s[k]+'</span>');});['tool','medicine','lens'].forEach(function(k){if(s[k])inv.push('<span class="badge">'+icon(k)+T(k==='medicine'&&s.wet?'wet':k)+'</span>');});el('inventory').innerHTML=inv.join('');el('clock').innerHTML='<span class="badge warm">'+T('turn')+' '+s.turn+'</span><span class="badge">'+(E.boatHere(s)?T('boat')+' '+(E.deadline(s)-s.turn)+' '+T('left'):T('gone'))+'</span>';el('pocket').hidden=!s.pocket;el('map').hidden=!!s.pocket;if(s.pocket){el('pocketTitle').textContent=T('pocketTitle');el('pocketIntro').textContent=T('pocketIntro');el('legend').textContent=T('pocketLegend');grid();}var scene=textScene();el('portrait').innerHTML=portrait(scene[0]);el('speaker').textContent=scene[1];el('role').textContent=T('role'+scene[0]);el('storyText').innerHTML=scene[2];var e=TEXT[LANG].events[lastKey];el('consequence').hidden=!e||lastKey==='arrival'||lastKey==='move';el('consequence').textContent=e||'';el('dice').innerHTML=s.lastDice.map(dice).join('');el('guide').textContent=T(s.pocket?'guidePocket':s.location==='mira'?'guideMira':s.location==='tower'?'guideTower':s.location==='willow'?'guideWillow':'guideQuay');var acts=el('actions');acts.innerHTML='';var options=E.legal(s).filter(function(a){return a.id!=='move'&&a.id!=='step';});options.forEach(function(a,i){var data=actionText(a),b=document.createElement('button');b.className='action'+(i===0?' primary':'');b.dataset.action=a.id;b.innerHTML='<span class="title">'+data[0]+'</span><span class="detail">'+data[1]+'</span><span class="cost">'+cost(a)+'</span>';b.onclick=function(){act(a);};acts.appendChild(b);});el('ending').hidden=!s.ending;if(s.ending){el('endingTitle').textContent=T('endingTitle');el('endingBody').textContent=T('end'+s.ending.charAt(0).toUpperCase()+s.ending.slice(1));el('endingHook').textContent=T('endingDemo');el('again').textContent=T('again');}el('journal').innerHTML=s.log.slice().reverse().map(function(e){return '<li><time>'+T('turn')+' '+e.turn+'</time> '+(TEXT[LANG].events[e.key]||e.key)+(e.key==='move'?' '+T(e.to):'')+'</li>';}).join('');el('resetTitle').textContent=T('resetTitle');el('resetText').textContent=T('resetText');el('yes').textContent=T('yes');el('no').textContent=T('no');}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s));localStorage.setItem(KEY+'.lang',LANG);saveOK=true;}catch(e){saveOK=false;}}
function act(a){try{s=E.apply(s,a);lastKey=a.id==='step'||a.id==='wait'?a.id:s.log[s.log.length-1].key;save();render();el('story').classList.remove('flash');void el('story').offsetWidth;el('story').classList.add('flash');if(a.id==='descend')el('pocket').scrollIntoView({block:'start',behavior:'smooth'});if(s.ending)el('ending').scrollIntoView({block:'center',behavior:'smooth'});}catch(e){el('saveText').textContent=e.message;}}
function showReset(){el('modal').hidden=false;el('no').focus();}el('lang').onclick=function(){LANG=LANG==='uk'?'en':'uk';save();render();};el('reset').onclick=showReset;el('again').onclick=showReset;el('no').onclick=function(){el('modal').hidden=true;el('reset').focus();};el('yes').onclick=function(){s=E.initial();lastKey='arrival';el('modal').hidden=true;save();render();window.scrollTo(0,0);};el('toActions').onclick=function(){el('story').scrollIntoView({block:'start',behavior:'smooth'});};document.addEventListener('keydown',function(e){if(e.key==='Escape')el('modal').hidden=true;});save();render();
})();
